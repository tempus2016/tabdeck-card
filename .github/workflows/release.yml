name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Everything that runs npm code happens here, with a read-only token. The job
  # that can write to the repository (publish, below) runs no dependency at all,
  # so a compromised build or test tool never holds that token.
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    # id-token and attestations are for the provenance step, which ties the asset
    # every install downloads to this run and this commit.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No npm cache: a cache entry written by any branch's run would be restored into
        # the job that builds the published bundle.
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Tag matches package.json version
        # package.json is the only place the version is written down in the tree;
        # a release that disagrees with it leaves the two to drift apart unnoticed.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump package.json and re-tag."
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## "tag { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Fall back to a CHANGELOG link if the tag has no matching section.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See the [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Checksums
        # SHA256SUMS lets anyone check a downloaded file without GitHub tooling:
        # `sha256sum -c SHA256SUMS`.
        run: |
          (cd dist && sha256sum -- *.js) > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the bundle's provenance
        # Signed statement that dist/tabdeck-card.js was built by this workflow from
        # this commit, checkable with `gh attestation verify`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tabdeck-card.js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/tabdeck-card.js
            SHA256SUMS
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # The asset name must stay tabdeck-card.js — it is the filename in hacs.json,
      # and HACS only counts downloads of an asset with that exact name.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/tabdeck-card.js
            SHA256SUMS
          body_path: RELEASE_NOTES.md
