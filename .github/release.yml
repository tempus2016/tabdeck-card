# Groups the "What's Changed" list GitHub generates for a release by label, so
# dependency bumps collapse into one section instead of padding the top. The
# area labels come from .github/labeler.yml, applied to every PR by path.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - stale
    authors:
      - dependabot
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Tab bar
      labels:
        - tab bar
    - title: Editor
      labels:
        - editor
    - title: Nested cards
      labels:
        - nested cards
    - title: Behaviour
      labels:
        - behaviour
    - title: Compatibility
      labels:
        - compatibility
    - title: Documentation
      labels:
        - documentation
    - title: CI & maintenance
      labels:
        - ci
        - tests
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
